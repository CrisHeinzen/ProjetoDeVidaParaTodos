# Ative com: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Crie antes o banco:  CREATE DATABASE projeto_de_vida;
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projeto_de_vida}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
