spring.application.name=projeto-de-vida-para-todos
server.port=8080

# Fuso horário usado para "hoje" e "semana atual"
app.fuso-horario=America/Sao_Paulo

# Banco padrão: H2 gravado em arquivo na pasta ./dados (criada automaticamente)
spring.datasource.url=jdbc:h2:file:./dados/projeto-de-vida;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Limite de upload para importação de backup JSON
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
